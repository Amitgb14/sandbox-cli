# A fleet: several agents at once, one per git branch.
#
#   sandbox-cli fleet run -f fleet.yaml
#
# Each task gets its own branch, its own git worktree, and its own detached
# container. Your own checkout is never touched, and the branches show up in your
# repository immediately.
#
# Try it without launching anything first:
#
#   sandbox-cli fleet run -f fleet.yaml --dry-run

# The agent every task runs. Only agents with a verified headless mode may
# appear here — a fleet is unattended, and an agent that stopped to ask for
# permission would hang until you noticed. Today: claude, codex.
agent: claude

# How many run at once. Below the task count, `fleet run` stays attached and
# starts the rest as earlier agents exit. Omit it and everything starts at once.
max_parallel: 2

# Applied to every task.
defaults:
  # Finite by default on purpose: three unbounded agents will take a laptop down.
  # Set either to "0" to opt out deliberately.
  memory: 4g
  cpus: "2"

  # Forward your git identity, so the agents' commits are attributed to you
  # rather than failing with "Please tell me who you are".
  git: true

  # Persist package-manager caches across runs, so five agents don't each
  # download the same dependencies into their own throwaway container.
  cache: true

  # Extra domains the agents may reach, on top of the built-in baseline
  # (the agent's own API, npm, PyPI, GitHub…). Anything not on the list is
  # refused by a default-deny firewall inside the container.
  # allow: [docs.example.com]

tasks:
  - branch: feature-login
    prompt: |
      Implement the login form in src/auth/. Follow the existing component
      patterns. Add tests. Commit your work when the tests pass.

    # The task's definition of done. It runs inside the container after the
    # agent, and its exit code decides the verdict — this is the difference
    # between "the agent stopped" and "the work is right".
    #
    # `fleet land` refuses to merge a branch whose verify failed. A task with no
    # verify still runs, but lands reported as *unverified* rather than passed,
    # because nothing checked it.
    verify: go build ./... && go test ./...

  - branch: feature-ratelimit
    prompt: |
      Add per-IP rate limiting to the HTTP handlers in src/server/. Add tests.
      Commit your work when the tests pass.
    verify: go test ./src/server/...

    # Extra arguments appended after the agent's own flags — the way to pass
    # something the fleet file has no key for.
    # args: ["--model", "opus"]
    #
    # Note: memory, cpus, allow, cache and git are fleet-wide (`defaults:`) for
    # now. A task cannot yet raise its own limits.

# Then:
#
#   sandbox-cli fleet status              # who is running, what they produced
#   sandbox-cli fleet logs feature-login  # what an agent actually said (-f to follow)
#   sandbox-cli fleet land feature-login  # commit + merge, refusing on any ambiguity
#   sandbox-cli fleet clean               # reap the finished containers
#
# For an unattended run, add --profile prod: it refuses where dev warns, which is
# what you want when nobody is watching the terminal.
