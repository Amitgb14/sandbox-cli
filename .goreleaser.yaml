# GoReleaser config — https://goreleaser.com
#
# Local dry run (no publishing, artifacts land in ./dist):
#   goreleaser release --snapshot --clean
#   goreleaser build --snapshot --clean --single-target
#
# Real release (needs an authenticated gh/GITHUB_TOKEN and push rights):
#   git tag 0.0.1beta.1 && git push origin 0.0.1beta.1
#   goreleaser release --clean --skip=validate
#
# --skip=validate is required because our tags are not valid semver
# ("0.0.1beta.1" — semver would want "v0.0.1-beta.1"), and GoReleaser parses the
# tag as semver during validation. Skipping it also disables the dirty-worktree
# and tag-matches-HEAD checks, so release from a clean checkout of the tag.
# Switching to semver tags later would let this flag be dropped.
version: 2

project_name: sandbox-cli

before:
  hooks:
    - go mod tidy

builds:
  # The client, everywhere: on a machine that cannot run sandboxes itself it
  # talks to one that can (sandbox-cli context add).
  - id: sandbox-cli
    main: ./cmd/sandbox-cli
    binary: sandbox-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Amitgb14/sandbox-cli/internal/version.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  # The server, where sandboxes can run: Linux with KVM (Firecracker), and
  # Apple-silicon macOS (the native container runtime). Intel Macs and Windows
  # get the client only.
  - id: sandboxd
    main: ./cmd/sandboxd
    binary: sandboxd
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Amitgb14/sandbox-cli/internal/version.Version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64

  # The guest agent runs inside every VM, so it is always a Linux binary —
  # on a Mac too, where the VM is linux/arm64. Static, because it is PID 1 of
  # a guest and the image may have no libc it could link against.
  - id: sandbox-guestd
    main: ./cmd/sandbox-guestd
    binary: sandbox-guestd
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Amitgb14/sandbox-cli/internal/version.Version={{ .Version }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  # sandbox-cli and, where it runs, sandboxd: one archive per platform, so the
  # client and server of one release cannot end up at different versions.
  - id: default
    ids:
      - sandbox-cli
      - sandboxd
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

  # The guest agent, per guest architecture. install.sh fetches the one for the
  # host's architecture and puts it beside sandboxd, which is where sandboxd
  # looks for it.
  - id: guestd
    ids:
      - sandbox-guestd
    formats: [tar.gz]
    name_template: >-
      sandbox-guestd_{{ .Version }}_linux_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request

release:
  # Explicitly true rather than `auto`: auto-detection parses the tag as semver,
  # and ours ("0.0.1beta.1") is not valid semver, so it cannot infer the
  # pre-release marker. Set this to false for a stable release.
  prerelease: true
  draft: false
  # Re-running a release (after fixing a failure, or re-triggering the workflow)
  # would otherwise abort with "422 already_exists" on the first asset that a
  # previous partial run had already uploaded. Overwrite instead, so publishing
  # is idempotent and safe to retry.
  replace_existing_artifacts: true
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/Amitgb14/sandbox-cli/main/install.sh | sh
    ```

    On Linux and Apple-silicon macOS this installs `sandbox-cli`, `sandboxd` and
    the guest agent; elsewhere, the client only. Then follow
    [local-macos.md](docs/local-macos.md) or [self-hosting.md](docs/self-hosting.md).
    Verify downloads against `checksums.txt`.
