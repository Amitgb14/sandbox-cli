# GoReleaser config — https://goreleaser.com
#
# Local dry run (no publishing, artifacts land in ./dist):
#   goreleaser release --snapshot --clean
#   goreleaser build --snapshot --clean --single-target
#
# Real release (needs an authenticated gh/GITHUB_TOKEN and push rights):
#   git tag 0.0.1beta.1 && git push origin 0.0.1beta.1
#   goreleaser release --clean --skip=validate
#
# --skip=validate is required because our tags are not valid semver
# ("0.0.1beta.1" — semver would want "v0.0.1-beta.1"), and GoReleaser parses the
# tag as semver during validation. Skipping it also disables the dirty-worktree
# and tag-matches-HEAD checks, so release from a clean checkout of the tag.
# Switching to semver tags later would let this flag be dropped.
version: 2

project_name: sandbox-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: sandbox-cli
    main: ./cmd/sandbox-cli
    binary: sandbox-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Amitgb14/sandbox-cli/internal/version.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  # Studio's control plane, shipped in the same archive as the CLI.
  #
  # It is released as a *binary* rather than only as an image because that is the
  # recommended way to run it: this server launches containers, so running it
  # inside one means mounting the host's docker socket into that container, which
  # is root on the host. A host process already has the access it needs and hands
  # nothing to anybody. The image exists for people who want the container shape
  # anyway (studio.sh --api-in-docker), and it should not be the only option a
  # release offers.
  - id: sandbox-studio-api
    main: ./cmd/sandbox-studio-api
    binary: sandbox-studio-api
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Amitgb14/sandbox-cli/internal/version.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    # One archive carrying both binaries, rather than one archive each.
    #
    # The name and layout are unchanged, which is what keeps install.sh working
    # untouched: it extracts `sandbox-cli` by name and ignores whatever else is
    # in there. studio.sh extracts the other one from the same file, so a Studio
    # install is one download rather than two, and the two halves cannot end up
    # at different versions.
    ids:
      - sandbox-cli
      - sandbox-studio-api
    # tar.gz everywhere except Windows, which gets a zip — the convention most
    # installers and package managers expect.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request

release:
  # False from 0.0.1 on: this is a stable release, and GitHub should not mark it
  # "Pre-release". Explicit rather than `auto` because auto-detection parses the
  # tag as semver and the beta tags ("0.0.1beta.1") were not valid semver, so it
  # could not infer the marker either way. Set it back to true for a tag that is
  # genuinely a pre-release.
  prerelease: false
  draft: false
  # Re-running a release (after fixing a failure, or re-triggering the workflow)
  # would otherwise abort with "422 already_exists" on the first asset that a
  # previous partial run had already uploaded. Overwrite instead, so publishing
  # is idempotent and safe to retry.
  replace_existing_artifacts: true
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/Amitgb14/sandbox-cli/main/install.sh | sh
    ```

    Verify downloads against `checksums.txt`.
