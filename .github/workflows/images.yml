name: images

# Publishes the two Studio images to GHCR.
#
#   ghcr.io/amitgb14/sandbox-studio-ui    the UI, safe to pull and run
#   ghcr.io/amitgb14/sandbox-studio-api   the control plane, for people who
#                                         choose the container shape knowing it
#                                         needs the host's docker socket
#
# On a tag they are published as that version *and* as `latest`, which is what
# studio.sh pulls by default. On a push to main only `edge` moves, so main is
# always installable without a release standing in for one.
#
# GHCR rather than Docker Hub: the workflow's own GITHUB_TOKEN can push here with
# `packages: write`, so publishing needs no long-lived credential stored in the
# repository — which is the same argument the tool itself makes about handing an
# agent a months-long token.
#
# It also *builds* on pull requests without pushing, because a workflow that only
# runs after merge means the first time a broken Dockerfile is noticed is on
# `main`, in the job that was supposed to publish. Those runs build one
# architecture and skip the registry login: nothing is being pushed, and a PR
# from a fork gets no `packages: write` to log in with anyway.
on:
  push:
    branches: [main]
    tags: ["*"]
    # A UI change and an API change touch different trees, so building both on
    # every docs commit would be most of the cost for none of the benefit.
    paths: &image_paths
      - "studio/**"
      - "cmd/sandbox-studio-api/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile.studio-api"
      - ".github/workflows/images.yml"
  pull_request:
    paths: *image_paths
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # One job per image, and they are independent: a UI build that fails should
      # not withhold an API image that is fine.
      fail-fast: false
      matrix:
        include:
          - image: sandbox-studio-ui
            context: ./studio
            dockerfile: ./studio/Dockerfile
          - image: sandbox-studio-api
            context: .
            dockerfile: ./Dockerfile.studio-api
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR rejects an uppercase path and this owner is `Amitgb14`, so the
          # name is lowercased — which metadata-action does on its own. Written
          # this way rather than hardcoded so a fork publishes under its own
          # owner without editing the file.
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # One architecture on a pull request: the second proves the manifest,
          # not the Dockerfile, and arm64 under QEMU is where the minutes go.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keyed by image, so the two matrix legs do not evict each other's
          # layers on every run.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
