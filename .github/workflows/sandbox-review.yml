name: Sandbox Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Install sandbox-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/Amitgb14/sandbox-cli/main/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run enhanced code review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          PROMPT='You are a senior staff engineer performing a thorough code review of this pull request.

          Output in this exact markdown structure:

          ## 📋 PR Summary
          - What this PR does (2-4 sentences)
          - Key changes and intent
          - Risk level: Low / Medium / High

          ## 🔍 Detailed Findings
          Group findings by severity (Critical / High / Medium / Low).
          For each issue include: Location, Issue, Why it matters, Suggested fix.

          ## 📊 Architecture / Flow Diagram
          Include a Mermaid diagram only if the change involves non-trivial flow or multiple components.

          ## 🧪 Test Coverage Gaps
          List important missing tests. Write actual test code for the most critical ones.

          ## ✅ Positive Notes
          Mention well-written parts.

          Be concise. Focus on real bugs, security, and correctness.'

          sandbox-cli claude \
            --profile prod \
            --no-metrics \
            --allow api.anthropic.com \
            --allow anthropic.com \
            --allow github.com \
            --allow api.github.com \
            --allow raw.githubusercontent.com \
            -- \
            -p "$PROMPT" > review.md 2>&1 || true

          echo "===== Review Output ====="
          cat review.md || true

      - name: Post inline review comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s review.md ] || grep -q "NO_FINDINGS" review.md; then
            echo "No findings to post"
            exit 0
          fi

          # Create a formal review with inline comments using GitHub CLI + API
          # We use a simple approach: post a review summary + individual line comments

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
            -f commit_id="$(git rev-parse HEAD)" \
            -f event="COMMENT" \
            -f body="## 🤖 Sandbox Code Review

          Automated review completed. See inline comments for details." \
            --input - <<EOF
          {
            "commit_id": "$(git rev-parse HEAD)",
            "event": "COMMENT",
            "body": "## 🤖 Sandbox Code Review\n\nSee inline comments below.",
            "comments": []
          }
          EOF
