name: base-image

# Publishes the sandbox base image (images/base/Dockerfile) for linux/amd64 and
# linux/arm64:
#
#   ghcr.io/<owner>/sandbox-base:<tag>    on a version tag, and :latest
#   ghcr.io/<owner>/sandbox-base:edge     on every push to main
#
# This is the only place a container engine is used: users never build the
# image. sandboxd pulls it — on Linux it becomes a read-only ext4 disk booted
# under Firecracker (internal/image), on macOS the native runtime runs it.
#
# Pull requests build it without pushing, so a broken Dockerfile is found before
# it reaches main rather than in the job meant to publish it.
on:
  push:
    branches: [main]
    tags: ["*"]
    paths: &paths
      - "images/base/**"
      - "cmd/sandbox-guestd/**"
      - "internal/guestproto/**"
      - "internal/vsock/**"
      - "internal/version/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/base-image.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sandbox-base
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base/Dockerfile
          # A pull request builds one architecture: nothing is pushed, and the
          # point is only to find a broken Dockerfile early.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
