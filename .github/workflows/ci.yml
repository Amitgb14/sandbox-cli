name: ci

# What runs before a change lands, and why it exists.
#
# Until now the Go suite ran in exactly one place: the release workflow, on tag
# push. So `main` was only ever compiled for the runner's own platform, and the
# first build for Windows happened *after* a version tag had been created. That
# is not hypothetical — 0.0.1beta.10 was tagged with a `syscall.Stat_t`
# reference in internal/sandbox, the Windows targets failed to compile, nothing
# published, and the tag had to be re-pointed at a fix.
#
# The lesson is not "add Windows"; it is that a release builds six targets and a
# PR built none of them. This runs the same six.
#
# Each job runs only for the parts of the tree it checks, decided by the
# `changes` job below, so a pull request that only touches Studio's screens
# does not wait for the Go matrix and one that only touches Go skips the web
# site. Jobs are skipped rather than the workflow filtered by `paths:`: a
# skipped job counts as passed for a required check, while a workflow that
# never started leaves one waiting forever.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Which parts of the tree a change touches. The rules lean towards running:
  #
  #   go      anything but studio/, web/, docs/, sdk/ and Markdown — a file
  #           nobody thought to list is checked, not skipped;
  #   studio  studio/ (but not its Markdown), and anything Go under cmd/ or
  #           internal/ or the module files, because Studio's e2e suite runs
  #           the real sandbox-cli, sandboxd and sandbox-gateway;
  #   web     web/;
  #   sdks    sdk/, and the same Go, since the Python tests start a sandboxd.
  #
  # A push to main, a manual run, and a change to this file run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.f.outputs.go }}
      studio: ${{ steps.f.outputs.studio }}
      web: ${{ steps.f.outputs.web }}
      sdks: ${{ steps.f.outputs.sdks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          all() { for k in go studio web sdks; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; }
          if [ "$EVENT" != pull_request ]; then all; exit 0; fi
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "changed:"; echo "$files"
          if echo "$files" | grep -qx '.github/workflows/ci.yml'; then all; exit 0; fi
          has() { echo "$files" | grep -Eq "$1" && echo true || echo false; }
          gocode='^(cmd/|internal/|go\.mod$|go\.sum$|Makefile$)'
          {
            echo "go=$(echo "$files" | grep -Ev '^(studio/|web/|docs/|sdk/)|\.md$' | grep -q . && echo true || echo false)"
            echo "studio=$(echo "$files" | grep -E "^studio/|$gocode" | grep -Ev '\.md$' | grep -q . && echo true || echo false)"
            echo "web=$(has '^web/')"
            echo "sdks=$(has "^sdk/|$gocode")"
          } | tee -a "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Cheapest first: a formatting or vet failure should not wait behind the
      # suite. `gofmt -l` prints offending files and exits 0, so the file list
      # is what has to fail the step.
      #
      # cmd and internal only: _old/ is the beta.15 tree kept to port from. The
      # Go tool skips it (vet, test and build never see it), it is frozen, and
      # it is deleted when the rewrite is done, so formatting it is not worth a
      # red build.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      # Unit tests only. The integration suite is behind the docker_integration
      # build tag and needs a daemon, which is deliberately not this job.
      - name: test
        run: go test ./...

      # The race detector. The whole tree while the rewrite is small; narrow it
      # back to the concurrent packages (spec, egressproxy, session, and later
      # fleet and studioapi) once -race on everything gets slow.
      - name: test -race
        run: go test -race ./...

  # Compile every target the release actually ships. Kept a separate job so its
  # verdict is legible on its own: "the release would not build" is a different
  # sentence from "a test failed".
  #
  # Covers .goreleaser.yaml's builds — sandbox-cli on {linux,darwin,windows} ×
  # {amd64,arm64}, sandboxd and the guest agent on a subset of those — by
  # building every package for every pair, CGO_ENABLED=0. If a target is added
  # there, add it here; a sweep that has drifted from what ships reassures.
  build-matrix:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Report every broken target in one run, rather than stopping at the first
      # and hiding the rest.
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ./... rather than ./cmd/sandbox-cli, which is all GoReleaser builds:
      # the break that motivated this was in internal/sandbox, and compiling
      # every package catches one in code the binary does not import yet.
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  # Studio's UI: typecheck, lint, the static export sandbox-cli embeds, the
  # check that a NEXT_PUBLIC_STUDIO_ADMIN=off build carries no admin screen,
  # and the end-to-end suite against `sandbox-cli studio` in front of an
  # in-memory sandboxd and a sandbox-gateway (studio/e2e). The suite runs the
  # binaries from bin/, so all three are built first.
  studio:
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Studio — typecheck, lint, build, admin-off build
        working-directory: studio
        run: npm ci --no-audit --no-fund && npm run typecheck && npm run lint && npm run build && npm run check:admin-off

      - name: Studio — end to end
        run: |
          go build -o bin/sandbox-cli ./cmd/sandbox-cli
          go build -o bin/sandboxd ./cmd/sandboxd
          go build -o bin/sandbox-gateway ./cmd/sandbox-gateway
          cd studio && npx playwright install --with-deps chromium && npm run test:e2e

  # The site in web/: typecheck, lint, build.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Web — typecheck, lint, build
        working-directory: web
        run: npm ci --no-audit --no-fund && npx tsc --noEmit && npm run lint && npm run build

  # The SDKs. Python at both ends of what it supports: 3.9 is what macOS still
  # ships as /usr/bin/python3, the interpreter somebody's agent script finds
  # without choosing it, and a test only on a modern one would not notice the
  # floor going. Its tests start a real sandboxd (in-memory backend) on a unix
  # socket. TypeScript: the package compiles under its own strict settings.
  sdks:
    needs: changes
    if: needs.changes.outputs.sdks == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Python SDK against sandboxd
        run: make test-sdk

      - uses: actions/setup-node@v4
        if: matrix.python == '3.13'
        with:
          node-version: 22

      - name: TypeScript SDK — typecheck
        if: matrix.python == '3.13'
        working-directory: sdk/typescript
        run: npm install --no-audit --no-fund && npx tsc --noEmit
