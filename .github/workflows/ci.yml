name: ci

# What runs before a change lands, and why it exists.
#
# Until now the Go suite ran in exactly one place: the release workflow, on tag
# push. So `main` was only ever compiled for the runner's own platform, and the
# first build for Windows happened *after* a version tag had been created. That
# is not hypothetical — 0.0.1beta.10 was tagged with a `syscall.Stat_t`
# reference in internal/sandbox, the Windows targets failed to compile, nothing
# published, and the tag had to be re-pointed at a fix.
#
# The lesson is not "add Windows"; it is that a release builds six targets and a
# PR built none of them. This runs the same six.
#
# Each job runs only for the parts of the tree it checks, decided by the
# `changes` job below, so a pull request that only touches Studio's screens
# does not wait for the Go matrix and one that only touches Go skips the web
# site. Jobs are skipped rather than the workflow filtered by `paths:`: a
# skipped job counts as passed for a required check, while a workflow that
# never started leaves one waiting forever.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Which parts of the tree a change touches. The rules lean towards running:
  #
  #   go      anything but studio/, web/, docs/, sdk/ and Markdown — a file
  #           nobody thought to list is checked, not skipped;
  #   studio  studio/ (but not its Markdown), and anything Go under cmd/ or
  #           internal/ or the module files, because Studio's e2e suite runs
  #           the real sandbox-cli, sandboxd and sandbox-gateway;
  #   web     web/, and the Markdown the site renders at /docs: docs/,
  #           sdk/**/*.md and studio/README.md (web/src/lib/docs.ts), so a
  #           doc whose link or anchor breaks fails the site's link check;
  #   sdks    sdk/, and the same Go, since the Python tests start a sandboxd.
  #
  # A push to main, a manual run, and a change to this file run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.f.outputs.go }}
      studio: ${{ steps.f.outputs.studio }}
      web: ${{ steps.f.outputs.web }}
      sdks: ${{ steps.f.outputs.sdks }}
      fleet: ${{ steps.fleet.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Whether the fleet job has what it needs. A job's `if` cannot read
      # secrets, so this step does, and says only whether they are set. Until
      # the gateway key and the tailnet's OAuth client are added, the fleet job
      # is skipped with a notice, rather than failing every push to main.
      - id: fleet
        env:
          SANDBOX_CI_TOKEN: ${{ secrets.SANDBOX_CI_TOKEN }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          missing=""
          for k in SANDBOX_CI_TOKEN TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET; do
            [ -n "$(printenv "$k")" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=fleet skipped::repository secrets not set:$missing"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          all() { for k in go studio web sdks; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; }
          if [ "$EVENT" != pull_request ]; then all; exit 0; fi
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "changed:"; echo "$files"
          if echo "$files" | grep -qx '.github/workflows/ci.yml'; then all; exit 0; fi
          has() { echo "$files" | grep -Eq "$1" && echo true || echo false; }
          gocode='^(cmd/|internal/|go\.mod$|go\.sum$|Makefile$)'
          {
            echo "go=$(echo "$files" | grep -Ev '^(studio/|web/|docs/|sdk/)|\.md$' | grep -q . && echo true || echo false)"
            echo "studio=$(echo "$files" | grep -E "^studio/|$gocode" | grep -Ev '\.md$' | grep -q . && echo true || echo false)"
            echo "web=$(has '^web/|^docs/|^sdk/.*\.md$|^studio/README\.md$')"
            echo "sdks=$(has "^sdk/|$gocode")"
          } | tee -a "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Cheapest first: a formatting or vet failure should not wait behind the
      # suite. `gofmt -l` prints offending files and exits 0, so the file list
      # is what has to fail the step.
      #
      # cmd and internal only: _old/ is the beta.15 tree kept to port from. The
      # Go tool skips it (vet, test and build never see it), it is frozen, and
      # it is deleted when the rewrite is done, so formatting it is not worth a
      # red build.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      # Unit tests only. The integration suite is behind the docker_integration
      # build tag and needs a daemon, which is deliberately not this job.
      - name: test
        run: go test ./...

      # The race detector. The whole tree while the rewrite is small; narrow it
      # back to the concurrent packages (spec, egressproxy, session, and later
      # fleet and studioapi) once -race on everything gets slow.
      - name: test -race
        run: go test -race ./...

  # The gateway's tests again on PostgreSQL, which the check job runs on
  # SQLite: every gateway test, plus what only PostgreSQL has — row-level
  # security between tenants and a standby taking over (make test-postgres).
  # Each test makes and drops a database of its own on the service.
  postgres:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: test on PostgreSQL
        env:
          SANDBOX_TEST_POSTGRES_DSN: postgres://postgres:ci@127.0.0.1:5432/postgres?sslmode=disable
        run: go test -count=1 ./internal/gateway/... ./cmd/sandbox-gateway/...

  # Compile every target the release actually ships. Kept a separate job so its
  # verdict is legible on its own: "the release would not build" is a different
  # sentence from "a test failed".
  #
  # Covers .goreleaser.yaml's builds — sandbox-cli on {linux,darwin,windows} ×
  # {amd64,arm64}, sandboxd and the guest agent on a subset of those — by
  # building every package for every pair, CGO_ENABLED=0. If a target is added
  # there, add it here; a sweep that has drifted from what ships reassures.
  build-matrix:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Report every broken target in one run, rather than stopping at the first
      # and hiding the rest.
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ./... rather than ./cmd/sandbox-cli, which is all GoReleaser builds:
      # the break that motivated this was in internal/sandbox, and compiling
      # every package catches one in code the binary does not import yet.
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  # Studio's UI: typecheck, lint, the static export sandbox-cli embeds, the
  # check that a NEXT_PUBLIC_STUDIO_ADMIN=off build carries no admin screen,
  # and the end-to-end suite against `sandbox-cli studio` in front of an
  # in-memory sandboxd and a sandbox-gateway (studio/e2e). The suite runs the
  # binaries from bin/, so all three are built first.
  studio:
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Studio — typecheck, lint, build, admin-off build
        working-directory: studio
        run: npm ci --no-audit --no-fund && npm run typecheck && npm run lint && npm run build && npm run check:admin-off

      - name: Studio — end to end
        run: |
          go build -o bin/sandbox-cli ./cmd/sandbox-cli
          go build -o bin/sandboxd ./cmd/sandboxd
          go build -o bin/sandbox-gateway ./cmd/sandbox-gateway
          cd studio && npx playwright install --with-deps chromium && npm run test:e2e

  # The site in web/: typecheck, lint, build. The build renders docs/ into
  # /docs and then checks every internal link and anchor of the export
  # (npm run check:docs, run by npm run build).
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Web — typecheck, lint, build
        working-directory: web
        run: npm ci --no-audit --no-fund && npx tsc --noEmit && npm run lint && npm run test:waitlist && npm run build

  # The SDKs. Python at both ends of what it supports: 3.9 is what macOS still
  # ships as /usr/bin/python3, the interpreter somebody's agent script finds
  # without choosing it, and a test only on a modern one would not notice the
  # floor going. Its tests start a real sandboxd (in-memory backend) on a unix
  # socket. TypeScript: the package compiles under its own strict settings.
  sdks:
    needs: changes
    if: needs.changes.outputs.sdks == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Python SDK against sandboxd
        run: make test-sdk

      - uses: actions/setup-node@v4
        if: matrix.python == '3.13'
        with:
          node-version: 22

      - name: TypeScript SDK — typecheck
        if: matrix.python == '3.13'
        working-directory: sdk/typescript
        run: npm install --no-audit --no-fund && npx tsc --noEmit

  # The suite again, in a real microVM on our own gateway rather than on the
  # runner: sandbox-cli creates a sandbox there, the checkout is streamed into
  # it, and `go vet` and `go test -race` run inside. Then the conformance suite
  # runs from the runner against the same gateway, which creates and ends
  # sandboxes of its own. This is what proves the fleet, not the fakes, still
  # does what the API says.
  #
  # The gateway is on a private tailnet. The runner is GitHub's own and joins
  # the tailnet for the job only, as an ephemeral node tagged tag:ci, which
  # the tailnet removes when the runner goes. The tag is what the tailnet's
  # access rules grant, so they can let a CI runner reach the gateway's API
  # port and nothing else. There is no machine of ours for a job to run on.
  #
  # It runs only on a push to main or a manual run, never on a pull request: a
  # PR could change this workflow or the tests to use the gateway key and the
  # tailnet login for something else. A fork's PR gets no secrets anyway, but
  # a branch in this repository would. A skipped job counts as passed, so this
  # does not hold a PR up.
  #
  # Needs, in the repository's settings: the secrets SANDBOX_CI_TOKEN (a
  # gateway API key, `sandbox-cli gateway keys create`), TS_OAUTH_CLIENT_ID and
  # TS_OAUTH_SECRET (a tailnet OAuth client allowed to create auth keys for
  # tag:ci), and optionally the variable SANDBOX_CI_ENDPOINT to point at
  # another gateway. Without all three secrets the job is skipped, and the run
  # carries a notice naming the missing ones. The default is the gateway's own
  # API port; the same host without a port is hosted Studio, which takes only
  # a browser session and refuses an API key.
  fleet:
    needs: changes
    if: needs.changes.outputs.go == 'true' && needs.changes.outputs.fleet == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run at a time on the gateway: two pushes in quick succession would
    # otherwise compete for its capacity and fail each other for no reason.
    concurrency:
      group: fleet
      cancel-in-progress: false
    env:
      SANDBOX_CI_ENDPOINT: ${{ vars.SANDBOX_CI_ENDPOINT || 'https://localhost-0.taile91c8c.ts.net:8443' }}
      SANDBOX_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: sandbox-cli and its context
        env:
          SANDBOX_CI_TOKEN: ${{ secrets.SANDBOX_CI_TOKEN }}
        run: |
          go build -o bin/sandbox-cli ./cmd/sandbox-cli
          # The run's own config directory, so a context added here neither reads
          # nor overwrites the runner user's ~/.config/sandbox. Set here, and for
          # the later steps, because a job's env cannot name the runner context.
          export XDG_CONFIG_HOME="$RUNNER_TEMP/sandbox-config"
          echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME" >> "$GITHUB_ENV"
          mkdir -p "$XDG_CONFIG_HOME"
          # The token by file, never on a command line.
          umask 077
          printf '%s' "$SANDBOX_CI_TOKEN" > "$RUNNER_TEMP/sandbox-ci.token"
          bin/sandbox-cli context add ci "$SANDBOX_CI_ENDPOINT" --token-file "$RUNNER_TEMP/sandbox-ci.token"
          bin/sandbox-cli context use ci
          bin/sandbox-cli whoami
          bin/sandbox-cli doctor

      # The checkout goes in as a tar on stdin (git archive: tracked files only,
      # so nothing of the runner's comes along), and the sandbox fetches only the
      # Go toolchain and modules. The base image has no Go, so the version is
      # the one go.mod names, for the guest's own architecture. sandbox-cli run
      # exits with the command's status, and removes the sandbox when it ends.
      - name: go vet and go test -race in a sandbox
        run: |
          GOVERSION="$(awk '$1 == "go" { print $2 }' go.mod)"
          git archive --format=tar HEAD | bin/sandbox-cli run \
            --name "$SANDBOX_NAME" \
            --label ci=github --label run="${{ github.run_id }}" \
            --template large --lifetime 45m \
            --network allowlist \
            --allow go.dev --allow dl.google.com \
            --allow proxy.golang.org --allow sum.golang.org --allow storage.googleapis.com \
            -e GOVERSION="$GOVERSION" \
            -- bash -c '
              set -euo pipefail
              case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; *) echo "unknown arch $(uname -m)"; exit 1 ;; esac
              mkdir -p src toolchain
              tar -x -C src
              curl -fsSL "https://go.dev/dl/go${GOVERSION}.linux-${arch}.tar.gz" | tar -xz -C toolchain
              export PATH="$PWD/toolchain/go/bin:$PATH" GOTOOLCHAIN=local
              cd src
              go version
              go vet ./...
              go test -race -count=1 ./...
            '

      - name: conformance suite against the gateway
        env:
          SANDBOX_CONFORMANCE_ENDPOINT: ${{ env.SANDBOX_CI_ENDPOINT }}
          SANDBOX_CONFORMANCE_TOKEN: ${{ secrets.SANDBOX_CI_TOKEN }}
        run: go test -count=1 -v -run TestEndpoint ./internal/api/conformance

      # A cancelled or timed-out run leaves its sandbox behind, since run only
      # removes it when the command ends. End it by name; it is gone already
      # after a run that finished, so a failure here is not one.
      - name: clean up
        if: always()
        run: |
          [ -x bin/sandbox-cli ] && bin/sandbox-cli kill "$SANDBOX_NAME" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/sandbox-ci.token"
