name: release

# Pushing a version tag publishes the release: cross-compiled archives for
# linux/macOS/Windows on amd64+arm64, checksums, and the changelog. Nothing is
# built on a laptop.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser builds the changelog from history, so it needs all of it.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      # Compile every target before GoReleaser starts, so a target that cannot
      # build fails in seconds with the offending file named, rather than part
      # way through a release that has already begun.
      #
      # This is the second line of defence, not the first: ci.yml runs the same
      # sweep on every pull request, which is where a Windows break should be
      # caught. It is repeated here because 0.0.1beta.10 proved the cost of
      # learning it at tag time — the tag existed, nothing published, and it had
      # to be re-pointed at a fix. A tag is the one thing in this process that is
      # awkward to take back.
      #
      # Mirrors .goreleaser.yaml's builds block. Keep the two lists in step.
      - name: Build every release target
        env:
          CGO_ENABLED: "0"
        run: |
          for goos in linux darwin windows; do
            for goarch in amd64 arm64; do
              echo "==> $goos/$goarch"
              GOOS=$goos GOARCH=$goarch go build ./... || exit 1
            done
          done

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --skip=validate
        env:
          # Publishes the release in this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
